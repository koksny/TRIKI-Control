[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triki-control"
version = "0.1.0-alpha.1"
description = "Desktop remapper for the TRIKI Bluetooth motion cap."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Wojciech \"Koksny\" Górny", email = "gorny.dx@gmail.com" }
]
dependencies = [
  "bleak==3.0.2",
  "Pillow==12.0.0",
  "pystray==0.19.5",
  "pywebview==6.2.1",
]

[project.urls]
Homepage = "https://koksny.com"
Repository = "https://github.com/koksny/TRIKI-Control"

[project.scripts]
triki-control = "triki_control.app:main"
triki-diagnostics = "triki_control.diagnostics:main"
triki-probe = "triki_control.probe:main"
triki-linux-smoke = "triki_control.linux_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
